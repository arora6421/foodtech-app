<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave mockup: Saved</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5EDE1}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px; display: flex; flex-direction: column; background: #F5EDE1; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #22150E">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: flex-start; color: #22150E; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase">Saved</div>
    <div style="width: 44px"></div>
  </div>
  <h1 style="margin: 6px 0 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 50px; line-height: 0.95; letter-spacing: -1.4px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">Back issues</h1>
  <p style="margin: 8px 0 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px">The dishes you kept.</p>
  <div style="height: 2px; background: #22150E; margin: 16px 0 16px"></div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <button type="button" style="position: relative; overflow: hidden; height: 214px; border: none; border-radius: 4px; background: #F2B441; color: #22150E; text-align: left; padding: 12px; display: flex; flex-direction: column; align-items: flex-start">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase">No. 04 · 24 Sep</span>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 24px; line-height: 0.95; margin-top: 6px">Tonkotsu ramen</span>
      <img src="images/tonkotsu-ramen.png" alt="" style="position: absolute; width: 150px; right: -40px; bottom: -34px; filter: drop-shadow(0 10px 12px rgba(70, 35, 0, 0.3))">
      <span style="position: absolute; left: 12px; bottom: 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 18px">£13.50</span>
      <svg width="170" height="214" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grains1"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="170" height="214" filter="url(#grains1)"></rect></svg>
    </button>
    <button type="button" style="position: relative; overflow: hidden; height: 214px; border: none; border-radius: 4px; background: #E98A4F; color: #22150E; text-align: left; padding: 12px; display: flex; flex-direction: column; align-items: flex-start">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase">No. 07 · 21 Sep</span>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 24px; line-height: 0.95; margin-top: 6px">Chana masala</span>
      <img src="images/chana-masala.png" alt="" style="position: absolute; width: 150px; right: -40px; bottom: -34px; filter: drop-shadow(0 10px 12px rgba(70, 35, 0, 0.3))">
      <span style="position: absolute; left: 12px; bottom: 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 18px">£9.00</span>
      <svg width="170" height="214" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grains2"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="170" height="214" filter="url(#grains2)"></rect></svg>
    </button>
    <button type="button" style="position: relative; overflow: hidden; height: 214px; border: none; border-radius: 4px; background: #EDA48E; color: #22150E; text-align: left; padding: 12px; display: flex; flex-direction: column; align-items: flex-start">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase">No. 02 · 18 Sep</span>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 24px; line-height: 0.95; margin-top: 6px">Margherita pizza</span>
      <img src="images/margherita-pizza.png" alt="" style="position: absolute; width: 150px; right: -40px; bottom: -34px; filter: drop-shadow(0 10px 12px rgba(70, 35, 0, 0.3))">
      <span style="position: absolute; left: 12px; bottom: 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 18px">£11.00</span>
      <svg width="170" height="214" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grains3"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="170" height="214" filter="url(#grains3)"></rect></svg>
    </button>
    <button type="button" style="position: relative; overflow: hidden; height: 214px; border: none; border-radius: 4px; background: #B9CC8E; color: #22150E; text-align: left; padding: 12px; display: flex; flex-direction: column; align-items: flex-start">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase">No. 05 · 15 Sep</span>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 24px; line-height: 0.95; margin-top: 6px">Chicken larb</span>
      <span style="position: absolute; right: -30px; bottom: -30px; width: 140px; height: 140px; border-radius: 50%; border: 2px solid #22150E; background: rgba(255, 246, 232, 0.4); display: flex; align-items: center; padding-left: 26px; box-sizing: border-box; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-style: italic; font-size: 96px; line-height: 1">L</span>
      <span style="position: absolute; left: 12px; bottom: 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 18px">£10.50</span>
      <svg width="170" height="214" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grains4"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="170" height="214" filter="url(#grains4)"></rect></svg>
    </button>
  </div>
</div>
</body>
</html>
