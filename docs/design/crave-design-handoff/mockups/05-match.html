<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave mockup: Match</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2B441}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px; background: #F2B441; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #22150E; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-style: italic; font-size: 32px; line-height: 1; letter-spacing: -1px">Crave</div>
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: flex-end; color: #22150E; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>
  <div style="height: 2px; background: #22150E"></div>
  <div>
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; margin-bottom: 8px">Tonight’s cover</div>
    <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 54px; line-height: 0.92; letter-spacing: -1.5px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">Tonkotsu ramen</h1>
    <p style="margin: 8px 0 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px">at Kōen Noodle Bar · £13.50 · 0.6 mi</p>
  </div>

  <div style="position: relative; height: 226px; display: flex; justify-content: center">
    <div style="position: absolute; width: 240px; height: 240px; left: 50%; margin-left: -110px; top: -4px; border-radius: 50%; background-image: radial-gradient(#22150E 1.3px, transparent 1.7px); background-size: 9px 9px; opacity: 0.2"></div>
    <img src="images/tonkotsu-ramen.png" alt="Tonkotsu ramen with chashu pork, marinated egg, nori and spring onion" style="position: relative; height: 226px; filter: drop-shadow(0 16px 20px rgba(70, 35, 0, 0.35))">
    <div style="position: absolute; right: 0; top: 4px; width: 86px; height: 86px; border-radius: 50%; background: #B8341C; color: #FFF6E8; display: flex; align-items: center; justify-content: center; text-align: center; transform: rotate(12deg); font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 17px; line-height: 1.05; box-shadow: 0 6px 14px rgba(70, 20, 0, 0.25)">Strong<br>match</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 9px">
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 26px">01</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.35">You kept saying yes to rich, brothy bowls</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 26px">02</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.35">Pork has been a steady yes today</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 26px">03</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.35">It fits the comforting craving you picked</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
    <button type="button" style="height: 54px; border: 2px solid #22150E; background: #22150E; color: #FFF6E8; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 21px">Order</button>
    <div style="display: flex; gap: 10px">
      <button type="button" style="flex-grow: 1; height: 48px; border: 2px solid #22150E; background: transparent; color: #22150E; border-radius: 4px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 15px">Get directions</button>
      <button type="button" style="flex-grow: 1; height: 48px; border: 2px solid #22150E; background: transparent; color: #22150E; border-radius: 4px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 15px">Save</button>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px">
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase">Or try</div>
    <div style="flex-grow: 1; height: 1.5px; background: #22150E"></div>
  </div>
  <div style="display: flex; gap: 10px">
    <button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px; border: none; background: rgba(255, 246, 232, 0.55); border-radius: 4px; color: #22150E; text-align: left">
      <img src="images/chana-masala.png" alt="" style="width: 40px; height: 40px">
      <span style="display: flex; flex-direction: column; font-family: 'Instrument Sans', sans-serif"><span style="font-size: 14px; font-weight: 700">Chana masala</span><span style="font-size: 12px; font-weight: 500">£9.00 · 0.9 mi</span></span>
    </button>
    <button type="button" style="flex-grow: 1; flex-basis: 0; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 8px; border: none; background: rgba(255, 246, 232, 0.55); border-radius: 4px; color: #22150E; text-align: left">
      <img src="images/margherita-pizza.png" alt="" style="width: 40px; height: 40px">
      <span style="display: flex; flex-direction: column; font-family: 'Instrument Sans', sans-serif"><span style="font-size: 14px; font-weight: 700">Margherita</span><span style="font-size: 12px; font-weight: 500">£11.00 · 0.4 mi</span></span>
    </button>
  </div>
  <svg width="390" height="844" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grainm"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="390" height="844" filter="url(#grainm)"></rect></svg>
</div>
</body>
</html>
