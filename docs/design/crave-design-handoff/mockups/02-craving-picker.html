<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave mockup: Craving picker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5EDE1}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 22px; display: flex; flex-direction: column; background: #F5EDE1; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #22150E">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: flex-start; color: #22150E; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase">Contents</div>
    <div style="width: 44px"></div>
  </div>
  <h1 style="margin: 6px 0 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 46px; line-height: 0.95; letter-spacing: -1.2px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">What’s the craving?</h1>
  <p style="margin: 10px 0 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px">Pick one. It only counts for tonight.</p>
  <div style="height: 2px; background: #22150E; margin-top: 16px"></div>

  <div style="display: flex; flex-direction: column">
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">01</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Spicy</span>
        
      </button>
    
      <button type="button" aria-pressed="true" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: #F2B441; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">02</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Comforting</span>
        
          <span style="position: absolute; right: 10px; top: 50%; margin-top: -14px; height: 28px; padding: 0 12px; border-radius: 999px; background: #B8341C; color: #FFF6E8; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; transform: rotate(-4deg)">Tonight</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">03</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Carby</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">04</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Fresh</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">05</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Indulgent</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">06</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Warm &amp; soupy</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">07</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Sweet</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">08</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">Something new</span>
        
      </button>
    
      <button type="button" aria-pressed="false" style="position: relative; display: flex; align-items: center; gap: 12px; height: 47px; padding: 0 10px; border: none; border-bottom: 1.5px solid #22150E; background: transparent; color: #22150E; text-align: left; width: 100%">
        <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 30px">09</span>
        <span style="font-family: 'Instrument Sans', sans-serif; font-size: 18px; font-weight: 600">I have no idea</span>
        
      </button>
    
  </div>

  <div style="flex-grow: 1"></div>
  <button type="button" style="height: 56px; border: 2px solid #22150E; background: #22150E; color: #FFF6E8; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px">Start swiping</button>
</div>
</body>
</html>
