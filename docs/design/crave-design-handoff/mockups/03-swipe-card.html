<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave mockup: Swipe card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5EDE1}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 22px; display: flex; flex-direction: column; gap: 14px; background: #F5EDE1; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #22150E">
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Close" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #22150E; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
    <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-style: italic; font-size: 34px; line-height: 1; letter-spacing: -1px; color: #22150E">Crave</div>
    <button type="button" aria-label="Undo" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; color: #22150E; padding: 0">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 010 12h-3"></path></svg>
    </button>
  </div>
  <div style="flex-grow: 1; position: relative; overflow: hidden; background: #F2B441; border-radius: 4px; padding: 22px 20px">
    <div style="position: absolute; right: -40px; top: 170px; width: 300px; height: 300px; border-radius: 50%; background-image: radial-gradient(#22150E 1.3px, transparent 1.7px); background-size: 9px 9px; opacity: 0.2"></div>
    <div style="position: relative; display: flex; justify-content: space-between; align-items: baseline">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px">Japanese noodle soup</div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 30px; line-height: 1">04</div>
    </div>
    <div style="position: relative; height: 2px; background: #22150E; margin: 10px 0 14px"></div>
    <h1 style="position: relative; margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 58px; line-height: 0.92; letter-spacing: -1.5px; max-width: 300px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">Tonkotsu ramen</h1>
    <div style="position: relative; margin-top: 14px; max-width: 120px">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase">Inside</div>
      <div style="margin-top: 4px; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 17px; line-height: 1.3">chashu pork<br>jammy egg<br>nori</div>
    </div>
    
    <img src="images/tonkotsu-ramen.png" alt="" style="position: absolute; width: 330px; right: -74px; top: 196px; filter: drop-shadow(0 18px 22px rgba(70, 35, 0, 0.35))">
    <div style="position: absolute; left: 14px; top: 300px; width: 98px; height: 98px; border-radius: 50%; background: #B8341C; color: #FFF6E8; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-10deg); box-shadow: 0 6px 14px rgba(70, 20, 0, 0.25)">
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 25px; line-height: 1">£13.50</div>
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px">a bowl</div>
    </div>
    <div style="position: absolute; left: 20px; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="border: 1.5px solid #22150E; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; ">Rich</span>
        <span style="border: 1.5px solid #22150E; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; ">Brothy</span>
        <span style="border: 1.5px solid #22150E; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; ">Pork</span>
        <span style="border: 1.5px solid #22150E; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; ">Mild heat</span>
      </div>
      <div style="height: 2px; background: #22150E"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-size: 16px; font-weight: 700">Kōen Noodle Bar</div>
        <div style="font-size: 14px; font-weight: 500">0.6 mi · 12 min walk</div>
      </div>
    </div>
    <svg width="358" height="700" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="358" height="700" filter="url(#grain)"></rect></svg>
  </div>
  <div style="display: flex; gap: 12px">
    <button type="button" style="flex-grow: 1; height: 56px; border: 2px solid #22150E; background: transparent; color: #22150E; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px">Nope</button>
    <button type="button" style="flex-grow: 1; height: 56px; border: 2px solid #22150E; background: #22150E; color: #FFF6E8; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px">Yes</button>
  </div>
  <button type="button" style="align-self: center; height: 44px; border: none; background: transparent; color: #22150E; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; padding: 0 12px">Decide for me</button>
</div>
</body>
</html>
