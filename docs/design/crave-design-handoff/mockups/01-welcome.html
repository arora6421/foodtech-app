<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave mockup: Welcome</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F2B441}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 22px 20px 24px; display: flex; flex-direction: column; background: #F2B441; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #22150E; position: relative; overflow: hidden">
  <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase">
    <span>Issue No. 01</span>
    <span>For the undecided</span>
  </div>
  <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-style: italic; font-size: 66px; line-height: 1; letter-spacing: -2px; margin-top: 8px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">Crave</div>
  <div style="height: 2px; background: #22150E; margin-top: 10px"></div>
  <div style="height: 1px; background: #22150E; margin-top: 3px"></div>

  <h1 style="margin: 22px 0 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 46px; line-height: 0.95; letter-spacing: -1.2px; max-width: 300px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">Hungry? Can’t decide?</h1>
  <p style="margin: 12px 0 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 19px; line-height: 1.3; max-width: 260px">Swipe a few dishes. We’ll work out the one you want.</p>

  <div style="position: relative; flex-grow: 1">
    <div style="position: absolute; width: 300px; height: 300px; right: -70px; top: 10px; border-radius: 50%; background-image: radial-gradient(#22150E 1.3px, transparent 1.7px); background-size: 9px 9px; opacity: 0.2"></div>
    <img src="images/margherita-pizza.png" alt="" style="position: absolute; width: 300px; right: -96px; top: 6px; filter: drop-shadow(0 18px 22px rgba(70, 35, 0, 0.35))">
    <img src="images/tonkotsu-ramen.png" alt="" style="position: absolute; width: 200px; left: -40px; top: 120px; filter: drop-shadow(0 16px 20px rgba(70, 35, 0, 0.35))">
    <img src="images/chana-masala.png" alt="" style="position: absolute; width: 150px; right: 18px; top: 236px; filter: drop-shadow(0 14px 18px rgba(70, 35, 0, 0.35))">
    <div style="position: absolute; left: 20px; top: 22px; width: 96px; height: 96px; border-radius: 50%; background: #B8341C; color: #FFF6E8; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(-10deg); box-shadow: 0 6px 14px rgba(70, 20, 0, 0.25)">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">About</span>
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 34px; line-height: 1">10</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase">swipes</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; position: relative">
    <button type="button" style="height: 56px; border: 2px solid #22150E; background: #22150E; color: #FFF6E8; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px">Just me</button>
    <button type="button" style="position: relative; height: 56px; border: 2px solid #22150E; background: rgba(255, 246, 232, 0.35); color: #22150E; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 22px">With friends
      <span style="position: absolute; right: 14px; top: 50%; margin-top: -13px; height: 26px; padding: 0 10px; border-radius: 999px; background: #B8341C; color: #FFF6E8; font-family: 'Instrument Sans', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center">Soon</span>
    </button>
  </div>
  <svg width="390" height="844" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="grainw"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="390" height="844" filter="url(#grainw)"></rect></svg>
</div>
</body>
</html>
