<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crave mockup: Alternative</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#E98A4F}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 12px; background: #E98A4F; font-family: 'Instrument Sans', 'Helvetica Neue', sans-serif; color: #22150E; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <button type="button" aria-label="Back" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: flex-start; color: #22150E; padding: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
    <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-style: italic; font-size: 32px; line-height: 1; letter-spacing: -1px">Crave</div>
    <div style="width: 44px"></div>
  </div>
  <div style="height: 2px; background: #22150E"></div>
  <div>
    <div style="font-size: 11px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; margin-bottom: 8px">Alternative</div>
    <h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 54px; line-height: 0.92; letter-spacing: -1.5px; text-shadow: 2px 1.5px 0 rgba(184, 52, 28, 0.55)">Chana masala</h1>
    <p style="margin: 8px 0 0; font-family: 'Playfair Display', Georgia, serif; font-style: italic; font-weight: 700; font-size: 18px">at [Venue name] · £9.00 · 0.9 mi</p>
  </div>

  <div style="position: relative; height: 226px; display: flex; justify-content: center">
    <div style="position: absolute; width: 240px; height: 240px; left: 50%; margin-left: -110px; top: -4px; border-radius: 50%; background-image: radial-gradient(#22150E 1.3px, transparent 1.7px); background-size: 9px 9px; opacity: 0.2"></div>
    <img src="images/chana-masala.png" alt="Chana masala with chickpeas in a tomato sauce, topped with coriander" style="position: relative; height: 226px; filter: drop-shadow(0 16px 20px rgba(70, 35, 0, 0.35))">
  </div>

  <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 24px; line-height: 1.1">Why it could suit you</div>
  <div style="display: flex; flex-direction: column; gap: 9px">
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 26px">01</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.35">Warm and saucy, like the bowls you said yes to</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: baseline">
      <span style="font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 20px; width: 26px">02</span>
      <span style="font-size: 15px; font-weight: 500; line-height: 1.35">Still fits the comforting craving you picked</span>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 54px; border: 2px solid #22150E; background: #22150E; color: #FFF6E8; border-radius: 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 900; font-size: 21px">Choose this instead</button>
    <button type="button" style="height: 48px; border: 2px solid #22150E; background: transparent; color: #22150E; border-radius: 4px; font-family: 'Instrument Sans', sans-serif; font-weight: 600; font-size: 15px">Return to our match</button>
  </div>
  <svg width="390" height="844" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply; opacity: 0.22; pointer-events: none" aria-hidden="true"><filter id="graina"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="390" height="844" filter="url(#graina)"></rect></svg>
</div>
</body>
</html>
